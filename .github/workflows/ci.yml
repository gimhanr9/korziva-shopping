name: Korziva CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Test and Build Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: korziva_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Run Prisma Database Migrations
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/korziva_test?schema=public
        run: npm run db:deploy

      - name: Seed Database
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/korziva_test?schema=public
          JWT_SECRET: ci_secret_jwt_key
          JWT_REFRESH_SECRET: ci_secret_refresh_key
        run: npm run db:seed

      - name: Execute Vitest Integration Tests
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/korziva_test?schema=public
          JWT_SECRET: ci_secret_jwt_key
          JWT_REFRESH_SECRET: ci_secret_refresh_key
          NODE_ENV: test
        run: npm run test

      - name: Build Express REST API
        run: npm run build:api

      - name: Build Next.js Web Storefront
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000/api
        run: npm run build:web
